# TCMB exchange rates for the Yachting Jurnal iPhone app (kur.json). TCMB publishes around 15:30 Turkish time.
name: TCMB kurlari
on:
  schedule:
    - cron: "41 12 * * 1-5"
    - cron: "23 13 * * 1-5"
    - cron: "7 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kur:
    runs-on: ubuntu-latest
    steps:
      # no third-party actions: a plain clone with the job's own token
      - run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" s
      - run: python3 .github/kur.py kur.json
        working-directory: s
      - working-directory: s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kur.json
          git diff --cached --quiet || (git commit -m "TCMB kurlari" && git push)
